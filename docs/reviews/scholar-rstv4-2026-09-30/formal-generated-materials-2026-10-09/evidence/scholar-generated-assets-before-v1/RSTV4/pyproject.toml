[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rstv4"
version = "0.1.0"
description = "Research Infrastructure Version 4 scientific state and Scholar MCP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "mcp==1.26.0",
  "openpyxl>=3.1,<4",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.12,<3",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]
skeleton-optimization = ["dspy==3.4.0"]

[project.scripts]
rstv4-mcp = "rstv4.mcp_server:main"
rstv4 = "rstv4.cli:main"
rstv4-paperpool-worker = "rstv4.acquisition_worker:main"
rstv4-paperpool-eval = "rstv4.paperpool_evaluation:main"
rstv4-studio-api = "rstv4.studio_api:main"
rstv4-catalog-web = "rstv4.catalog_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rstv4 = ["catalog_web.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
