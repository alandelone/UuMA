<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UuMA Lab Bot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h2>UuMA Lab Bot</h2>
      <span id="hostStatusBadge" class="badge badge-disconnected">Checking...</span>
    </header>

    <div id="activeTabStatus" style="font-size:11px;color:#4b5563;background:#f3f4f6;padding:4px 8px;border-radius:4px;margin-bottom:8px;word-break:break-all;">
      Detecting active page...
    </div>

    <section class="section">
      <h3>Active Task</h3>
      <div id="activeTaskInfo" class="task-info">
        <p>Ready to extract orders.</p>
      </div>
    </section>

    <section class="section">
      <h3>Order Extraction</h3>
      <div class="form-group">
        <label for="platformSelect">Platform:</label>
        <select id="platformSelect">
          <option value="taobao">Taobao (淘宝)</option>
          <option value="shopee">Shopee MY</option>
          <option value="pdd">Pinduoduo (拼多多)</option>
        </select>
      </div>
      <button id="btnStart" class="btn btn-primary" style="margin-bottom: 8px;">Start DOM Extraction</button>
      <button id="btnExportTaobao" class="btn btn-secondary" style="display: none; background: #ff5000; color: white;">点击淘宝【导出订单】</button>
    </section>

    <footer class="footer">
      <small>Local-first governed control plane</small>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
