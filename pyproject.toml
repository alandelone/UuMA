[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uuma"
version = "0.1.0"
description = "Local-first control plane for a Hermes multi-agent system"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9.14,<10",
  "fastapi>=0.104,<1",
  "mcp==1.26.0",
  "openpyxl>=3.1,<4",
  "pydantic>=2.12,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "ruamel.yaml>=0.18,<1",
  "uvicorn>=0.24,<1",
]

[project.optional-dependencies]
distributed = ["a2a-sdk[http-server]==1.2.3", "httpx>=0.28,<1", "PyYAML>=6,<7"]
workstation = ["psutil==7.2.2"]
public-access = ["httpx>=0.28,<1", "websockets>=15,<18"]
chatgpt = ["playwright>=1.51,<2"]
dev = [
  "PyYAML>=6,<7",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.11,<1",
]
observability = [
  "arize-phoenix-otel>=0.17,<1",
]

[project.scripts]
uuma = "uuma.cli:main"
uuma-api = "uuma.api:main"
uuma-control-mcp = "uuma.mcp_control:main"
uuma-worker-mcp = "uuma.mcp_worker:main"
uuma-gemini-mcp = "uuma.mcp_gemini:main"
uuma-knowledge-mcp = "uuma.mcp_knowledge:main"
uuma-kag-bridge = "uuma.kag_bridge:main"
uuma-orbit-runner = "uuma.orbit_runner:main"
uuma-chatgpt-bridge = "uuma.chatgpt_cli:main"
uuma-chatgpt-mcp = "uuma.mcp_chatgpt:main"
uuma-a2a = "uuma.a2a_node:main"
uuma-remote-mcp = "uuma.remote_mcp:main"
uuma-release = "uuma.release:main"
uuma-migration = "uuma.migration:main"
uuma-node-bootstrap = "uuma.node_bootstrap:main"
uuma-source-snapshot = "uuma.source_snapshot:main"
uuma-profile-migration = "uuma.profile_migration:main"
uuma-provider-pool = "uuma.provider_pool:main"
uuma-provider-pool-web = "uuma.provider_pool_web:main"

[tool.setuptools.package-data]
uuma = ["chatgpt_dashboard.html", "chatgpt_dashboard.js", "provider_pool.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
